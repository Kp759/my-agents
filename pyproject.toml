[project]
name = "my-agents"
version = "0.1.0"
description = "Open-source, model-agnostic ecosystem of personal agents for PhD study"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
my-agents = "my_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_agents = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real CLI or local model (run with -m live)"]
addopts = "-m 'not live'"
