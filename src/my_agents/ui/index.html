<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Agents</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #b4532a; --ok: #2f7d4f; --err: #b3261e; --code: #f1f0ec; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9a93; --line: #33332f;
          --accent: #e0835a; --ok: #6cc28f; --err: #f08a80; --code: #262624; --chip: #2b2b28; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; border-bottom: 1px solid var(--line);
         background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
header h1 span { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 6px;
             font: inherit; cursor: pointer; }
nav button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block;
            margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } main { padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
pre, code { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
pre { background: var(--code); padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
      max-height: 420px; overflow: auto; margin: 6px 0; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px;
        margin: 2px 4px 2px 0; white-space: nowrap; }
.agent { font-weight: 600; }
.err { color: var(--err); }
.ok { color: var(--ok); }
.list .item { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.list .item:hover { background: var(--chip); }
.list .item.on { border-color: var(--accent); background: var(--chip); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0 12px; }
.flow .arrow { color: var(--muted); }
.step { border-left: 4px solid var(--lane, var(--line)); padding: 8px 12px; margin: 6px 0; background: var(--bg);
        border-radius: 0 8px 8px 0; }
.step .head { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.step .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); min-width: 64px; }
.step .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.step .body { margin-top: 4px; color: var(--ink); word-break: break-word; }
details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-top: 6px; }
.msg { margin: 6px 0; }
.msg b { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.totals { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 12px; background: var(--chip); border-radius: 8px;
          font-size: 13px; margin-bottom: 8px; }
.totals b { font-size: 15px; }
.board-row { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.board-row .t { color: var(--muted); font-size: 11px; margin-right: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
        border-top: 4px solid var(--lane, var(--line)); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.tablewrap { overflow-x: auto; }
button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px;
             padding: 6px 12px; font: inherit; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.del { border: 0; background: none; color: var(--muted); cursor: pointer; }
button.del:hover { color: var(--err); }
.md h1 { font-size: 20px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; margin-bottom: 2px; }
.learn h3 { margin: 18px 0 4px; font-size: 15px; }
.learn p { margin: 4px 0 8px; max-width: 75ch; }
svg text { fill: var(--ink); font: 12px -apple-system, sans-serif; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="brand">My <span>Agents</span></h1>
  <nav id="tabs"></nav>
  <span class="small muted" style="margin-left:auto"><span class="live-dot"></span>live · refreshes every 2 s</span>
</header>
<main id="view"></main>

<script>
const TABS = [
  ["live", "Live"], ["requests", "Requests"], ["agents", "Agents"],
  ["memory", "Memory"], ["eod", "End of day"], ["learn", "How it works"],
];
let tab = location.hash.slice(1) || "live";
let selectedRun = null;
let timer = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts) => (await fetch(path, opts)).json();
const hue = (name) => { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const lane = (name) => `hsl(${hue(name)} 55% 50%)`;
const k = (n) => n == null ? "–" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const secs = (ms) => ms == null ? "" : (ms / 1000).toFixed(1) + "s";
const money = (c) => c == null ? "" : "$" + c.toFixed(4);
const time = (ts) => new Date(ts).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const agentChip = (a) => `<span class="chip agent" style="color:${lane(a)}">@${esc(a)}</span>`;

function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) =>
    `<button class="${id === tab ? "on" : ""}" onclick="go('${id}')">${label}</button>`).join("");
}
function go(id) { tab = id; location.hash = id; renderTabs(); show(); }

async function show() {
  clearInterval(timer);
  const views = {live, requests, agents, memory, eod, learn};
  await views[tab]();
  if (["live", "requests"].includes(tab)) timer = setInterval(() => views[tab](true), 2000);
}

// ---------- request timeline ----------
function flow(rows) {
  const parts = [];
  for (const r of rows) {
    if (r.node === "route") parts.push(`<span class="chip">route · ${esc(r.model || "–")}</span>`, `<span class="arrow">→</span>`, agentChip(r.agent));
    if (r.node === "delegate" && r.ok) parts.push(`<span class="arrow">⇢ delegates ⇢</span>`, agentChip((r.decision || "").split("→").pop().trim()));
    if (r.node === "return") parts.push(`<span class="arrow">↩ returns to</span>`, agentChip((r.decision || "").split("→").pop().trim()));
  }
  return `<div class="flow">${parts.join("")}</div>`;
}

function ioBlock(io) {
  if (!io) return "";
  if ("args" in io) {
    return `<details><summary>full arguments and result</summary>
      <div class="msg"><b>arguments</b><pre>${esc(JSON.stringify(io.args, null, 2))}</pre></div>
      <div class="msg"><b>result</b><pre>${esc(typeof io.result === "string" ? io.result : JSON.stringify(io.result, null, 2))}</pre></div></details>`;
  }
  const msgs = (io.messages || []).map((m) =>
    `<div class="msg"><b>${esc(m.role)}</b><pre>${esc(m.content)}</pre></div>`).join("");
  return `<details><summary>exact prompt and raw reply</summary>
    <div class="msg"><b>system prompt</b><pre>${esc(io.system)}</pre></div>
    ${msgs}
    <div class="msg"><b>raw reply</b><pre>${esc(io.output ?? "(no reply: error)")}</pre></div></details>`;
}

function stepCard(r, io) {
  const err = r.error ? `<div class="err small">error: ${esc(r.error)}</div>` : "";
  const pad = `margin-left:${(r.depth || 0) * 22}px`;
  if (r.node === "route") {
    return `<div class="step" style="--lane:var(--muted);${pad}">
      <div class="head"><span class="kind">route</span><span>${esc(r.decision)}</span>
      <span class="meta">${esc(r.model || "")} · ${secs(r.latency_ms)}</span></div>
      <div class="body muted">“${esc(r.input_preview)}”</div>${err}${ioBlock(io)}</div>`;
  }
  if (r.node === "approval") {
    const cls = r.decision === "no" ? "err" : "ok";
    return `<div class="step" style="--lane:var(--accent);margin-left:${((r.depth || 0) * 22) + 22}px">
      <div class="head"><span class="kind">approval</span><code>${esc(r.tool)}</code>
      <span class="${cls}">you said ${esc(r.decision)}</span></div>
      <div class="body small muted">${esc(r.reason)} · ${esc(r.args)}</div></div>`;
  }
  if (r.node === "delegate" || r.node === "return") {
    return `<div class="step" style="--lane:${lane(r.agent)};${pad}">
      <div class="head"><span class="kind">${r.node}</span><span class="agent">@${esc(r.decision)}</span></div>
      <div class="body small">${esc(r.args || r.output_preview || "")}</div>${err}</div>`;
  }
  if (r.node === "tools") {
    return `<div class="step" style="--lane:${lane(r.agent)};margin-left:${((r.depth || 0) * 22) + 22}px">
      <div class="head"><span class="kind">tool</span><code>${esc(r.tool)}</code>
      <span class="meta">${secs(r.latency_ms)}</span></div>
      <div class="body small muted">${esc(r.args)}</div>
      ${r.output_preview ? `<div class="body small">↳ ${esc(r.output_preview)}</div>` : ""}${err}${ioBlock(io)}</div>`;
  }
  const cost = r.cost_estimate ?? r.cost_usd;
  return `<div class="step" style="--lane:${lane(r.agent)};${pad}">
    <div class="head"><span class="kind">agent</span><span class="agent" style="color:${lane(r.agent)}">@${esc(r.agent)}</span>
    <span class="small">${esc(r.action || "")}</span>
    <span class="meta">${esc(r.model || r.backend)} · ${secs(r.latency_ms)} · ${k(r.input_tokens)}→${k(r.output_tokens)} tok ${money(cost)}</span></div>
    ${r.action === "final answer" ? `<div class="body">${esc(r.output_preview)}</div>` : ""}${err}${ioBlock(io)}</div>`;
}

function totalsBar(t) {
  if (!t) return "";
  const unpriced = t.unpriced_backends.length ? ` <span class="muted small">(+ ${esc(t.unpriced_backends.join(", "))}: tokens only)</span>` : "";
  return `<div class="totals">
    <span><b>${t.wall_s.toFixed(1)}s</b> wall time</span><span><b>${t.model_calls}</b> model calls</span>
    <span><b>${t.tool_calls}</b> tool calls</span><span><b>${t.delegations}</b> delegations</span>
    <span><b>${k(t.input_tokens)}</b> in (${k(t.cached_input_tokens)} cached) / <b>${k(t.output_tokens)}</b> out</span>
    <span><b>${money(t.cost_usd)}</b> API-equivalent${unpriced}</span>
    ${t.errors ? `<span class="err"><b>${t.errors}</b> errors</span>` : ""}</div>`;
}

async function runDetail(runId) {
  const d = await api(`/api/run/${runId}`);
  if (!d.rows.length) return `<div class="empty">no trace</div>`;
  return `${flow(d.rows)}${totalsBar(d.totals)}${d.rows.map((r) => stepCard(r, d.io[r.step_id])).join("")}`;
}

// keep <details> open across refreshes
function keepOpen(container, html) {
  const open = [...container.querySelectorAll("details")].map((d, i) => d.open ? i : -1).filter((i) => i >= 0);
  container.innerHTML = html;
  const all = container.querySelectorAll("details");
  open.forEach((i) => all[i] && (all[i].open = true));
}

// ---------- tabs ----------
let lastLiveKey = "";
async function live(refresh) {
  const [runs, board] = await Promise.all([api("/api/runs?days=1"), api("/api/board?limit=60")]);
  const latest = runs[0];
  const key = JSON.stringify([latest?.run_id, latest?.steps, board.at(-1)?.id]);
  if (refresh && key === lastLiveKey) return;
  lastLiveKey = key;
  if (!refresh) $("#view").innerHTML = `<div class="grid">
      <div class="panel"><h2>Board · what agents are doing</h2><div id="board"></div></div>
      <div class="panel"><h2>Latest request</h2><div id="latest"></div></div></div>`;
  $("#board").innerHTML = board.length ? board.slice().reverse().map((b) =>
    `<div class="board-row"><span class="t">${time(b.created)}</span>${agentChip(b.agent)}<span class="chip">${esc(b.kind)}</span>${esc(b.content)}</div>`).join("")
    : `<div class="empty">No posts yet. Run <code>my-agents chat</code> in a terminal.</div>`;
  keepOpen($("#latest"), latest
    ? `<div class="muted small">${time(latest.ts)} · request ${esc(latest.run_id.slice(0, 8))}</div>
       <p><b>“${esc(latest.input)}”</b></p>${await runDetail(latest.run_id)}`
    : `<div class="empty">No requests today yet.</div>`);
}

let lastReqKey = "";
async function requests(refresh) {
  const runs = await api("/api/runs?days=7");
  if (!selectedRun && runs[0]) selectedRun = runs[0].run_id;
  const key = JSON.stringify([runs.length, runs[0]?.steps, selectedRun]);
  if (refresh && key === lastReqKey) return;
  lastReqKey = key;
  if (!refresh || !$("#runlist")) $("#view").innerHTML = `<div class="grid">
      <div class="panel"><h2>Requests · last 7 days</h2><div id="runlist" class="list"></div></div>
      <div class="panel"><h2>Step by step</h2><div id="rundetail"></div></div></div>`;
  $("#runlist").innerHTML = runs.length ? runs.map((r) => `
    <div class="item ${r.run_id === selectedRun ? "on" : ""}" onclick="selectedRun='${r.run_id}'; lastReqKey=''; requests(true)">
      <div class="small muted">${new Date(r.ts).toLocaleString()} · ${r.wall_s.toFixed(1)}s · ${money(r.cost_usd)}</div>
      <div>${esc(r.input || "(no input)")}</div>
      <div>${r.path.map(agentChip).join('<span class="muted">→</span>')}</div></div>`).join("")
    : `<div class="empty">No requests yet.</div>`;
  if (selectedRun) keepOpen($("#rundetail"), await runDetail(selectedRun));
}

function topology(data) {
  const W = 760, H = 460, cx = W / 2, cy = 270, R = 165;
  const names = data.agents.map((a) => a.name);
  const orch = data.router.orchestrator;
  const others = names.filter((n) => n !== orch);
  const pos = {[orch]: [cx, cy]};
  others.forEach((n, i) => {
    const a = (i / others.length) * 2 * Math.PI - Math.PI / 2;
    pos[n] = [cx + R * 1.45 * Math.cos(a), cy + R * Math.sin(a)];
  });
  const routerPos = [cx, 28];
  let edges = "", nodes = "";
  for (const a of data.agents) for (const d of a.delegates) {
    const [x1, y1] = pos[a.name], [x2, y2] = pos[d];
    edges += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lane(a.name)}" stroke-width="1.5" stroke-opacity=".55" marker-end="url(#arr)"/>`;
  }
  edges += `<line x1="${routerPos[0]}" y1="${routerPos[1] + 14}" x2="${cx}" y2="${cy - 22}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  for (const n of names) {
    const [x, y] = pos[n];
    nodes += `<g><circle cx="${x}" cy="${y}" r="${n === orch ? 24 : 17}" fill="${lane(n)}" fill-opacity=".18" stroke="${lane(n)}" stroke-width="2"/>
      <text x="${x}" y="${y + (n === orch ? 40 : 32)}" text-anchor="middle">@${esc(n)}</text></g>`;
  }
  nodes += `<g><rect x="${routerPos[0] - 95}" y="${routerPos[1] - 14}" width="190" height="28" rx="6" fill="var(--chip)" stroke="var(--line)"/>
    <text x="${routerPos[0]}" y="${routerPos[1] + 4}" text-anchor="middle">router · ${esc(data.router.model)} (${esc(data.router.entry)})</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>${edges}${nodes}</svg>
    <div class="small muted">Dashed: the router sends each message to one agent (any agent, not only the orchestrator).
    Arrows: who may delegate to whom.</div>`;
}

async function agents() {
  const d = await api("/api/agents");
  $("#view").innerHTML = `
    <div class="panel" style="margin-bottom:20px"><h2>Team topology</h2>${topology(d)}</div>
    <div class="panel" style="margin-bottom:20px"><h2>Shared mission · prepended to every agent's prompt</h2><pre>${esc(d.mission || "(none)")}</pre></div>
    <div class="cards">${d.agents.map((a) => `
      <div class="card" style="--lane:${lane(a.name)}">
        <h3>@${esc(a.name)}</h3>
        <div class="small muted">${esc(a.backend)} ${esc(a.model || "")} · ${a.memories} memories</div>
        <p class="small">${esc(a.description)}</p>
        <div class="small"><b>Today:</b> ${a.today.calls} model calls · ${a.today.tool_calls} tool calls · ${k(a.today.tokens)} tokens · ${money(a.today.cost_usd)}</div>
        ${a.tools.length ? `<div class="small" style="margin-top:6px"><b>Tools:</b> ${a.tools.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
        ${a.delegates.length ? `<div class="small"><b>Delegates to:</b> ${a.delegates.map(agentChip).join("")}</div>` : ""}
        <details><summary>role prompt</summary><pre>${esc(a.system_prompt)}</pre></details>
      </div>`).join("")}</div>`;
}

async function memory() {
  const d = await api("/api/memory");
  const groups = {};
  for (const m of d.memories) (groups[m.agent] ||= []).push(m);
  const order = Object.keys(groups).sort((a, b) => (a === "*" ? -1 : b === "*" ? 1 : a.localeCompare(b)));
  const mem = order.length ? order.map((agent) => `
    <h3 style="margin:14px 0 4px">${agent === "*" ? "Shared profile (every agent sees this)" : agentChip(agent)}</h3>
    ${groups[agent].map((m) => `<div class="board-row"><span class="chip">${esc(m.kind)}</span>${esc(m.content)}
      <span class="t">#${m.id} · ${new Date(m.created).toLocaleDateString()}</span>
      <button class="del" title="delete this memory" onclick="forget(${m.id})">✕</button></div>`).join("")}`).join("")
    : `<div class="empty">No memories yet. Agents save them with the <code>remember</code> tool as you work.</div>`;
  const tables = Object.entries(d.tables).map(([name, rows]) => {
    if (!rows.length) return `<h3>${name}</h3><div class="muted small">empty</div>`;
    const cols = Object.keys(rows[0]).filter((c) => !["created", "updated"].includes(c));
    return `<h3>${name} <span class="muted small">(${rows.length})</span></h3><div class="tablewrap"><table>
      <tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
      ${rows.map((r) => `<tr>${cols.map((c) => `<td>${esc(typeof r[c] === "object" ? JSON.stringify(r[c]) : r[c])}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  }).join("");
  $("#view").innerHTML = `<div class="panel" style="margin-bottom:20px"><h2>Agent memory · added to each agent's prompt</h2>${mem}</div>
    <div class="panel"><h2>Shared store · what agents read and write through tools</h2>${tables}</div>`;
}
async function forget(id) {
  await api(`/api/memory/${id}/delete`, {method: "POST"});
  memory();
}

function md(text) {
  const lines = esc(text).split("\n");
  let html = "", table = [];
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/_\((.+?)\)_/g, "<i>($1)</i>");
  const flush = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|[-| ]+\|$/.test(r)).map((r) => r.slice(1, -1).split("|").map((c) => inline(c.trim())));
    html += `<div class="tablewrap"><table><tr>${rows[0].map((c) => `<th>${c}</th>`).join("")}</tr>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
    table = [];
  };
  for (const l of lines) {
    if (l.startsWith("|")) { table.push(l); continue; }
    flush();
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (/^\s*[-*] /.test(l)) html += `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  flush();
  return html;
}

async function eod() {
  const today = new Date().toLocaleDateString("en-CA");
  const day = $("#eodday")?.value || today;
  const d = await api(`/api/eod?date=${day}`);
  $("#view").innerHTML = `<div class="panel">
    <h2>End-of-day report</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <input id="eodday" type="date" value="${day}" onchange="eod()" class="btn">
      <button class="btn" onclick="makeEod(false)">Generate (numbers only)</button>
      <button class="btn" onclick="makeEod(true)">Generate with written summary (local model)</button>
      <span id="eodstatus" class="small muted"></span></div>
    <div class="md">${d.report ? md(d.report) : `<div class="empty">No report saved for ${day} yet. ${d.facts.user_requests} requests that day.</div>`}</div></div>`;
}
async function makeEod(llm) {
  $("#eodstatus").textContent = llm ? "writing the summary with the local model…" : "computing…";
  await api(`/api/eod?date=${$("#eodday").value}&llm=${llm ? 1 : 0}`, {method: "POST"});
  eod();
}

function learn() {
  $("#view").innerHTML = `<div class="panel learn"><h2>How this multi-agent system works</h2>
  <p class="muted">Every concept below is visible in the other tabs, and each points to the code that implements it. Nothing is hidden: open any step in <b>Requests</b> to see the exact prompt the model received and its raw reply.</p>

  <h3>1. A request comes in: routing</h3>
  <p>Your message first reaches the <b>router</b>, a small local model (Qwen3 8B through Ollama) that reads one-line descriptions of every agent and answers with a name. It is fast (≈0.4 s) and free. If its answer names no agent, the request goes to the default agent. <code>@agent</code> skips routing. <i>Code: <code>graph.py → route</code>, prompt <code>ROUTER_PROMPT</code>.</i></p>
  <p><b>Why it matters for MAS research:</b> routing is the cheapest place to save cost. A wrong route wastes a whole expensive agent call; a router that is too eager to call the orchestrator multiplies calls.</p>

  <h3>2. Agents: a role, a model, tools and memory</h3>
  <p>Each agent is one YAML file in <code>agents/</code>. Its system prompt is assembled on every call as: <b>shared mission</b> + <b>role prompt</b> + <b>its memory</b> (+ recent board posts for some agents) + <b>tool instructions</b>. See the exact assembled prompt in any step's "exact prompt" panel. Agents run on different backends: Claude Code CLI, Codex CLI, or a local model. <i>Code: <code>agents.py</code>, <code>graph.py → make_agent_node</code>.</i></p>

  <h3>3. Tools: how a text model takes actions</h3>
  <p>The CLIs give us plain text, not native function calling, so tools use a small text protocol: the model replies with only <code>{"tool": …, "args": …}</code> in a JSON block; the graph runs the tool and sends the result back as the next message; the loop repeats until the model replies in plain text. This is the <b>ReAct loop</b> (reason → act → observe). Each loop is capped at 10 tool calls. <i>Code: <code>toolcall.py</code>, <code>graph.py → tools_node</code>, tools in <code>tools/</code>.</i></p>

  <h3>4. Orchestration: delegation with a call stack</h3>
  <p>The <b>orchestrator</b> plans and calls other agents with the <code>delegate</code> tool. Delegation works like a function call: the caller is pushed on a stack, the delegate works on a <b>self-contained task in isolation</b> (it does not see your conversation, which saves tokens), and its final answer returns to the caller as a tool result. The Coder delegates to the Reviewer the same way. Depth is capped at 2 and delegations at 6 per request so agents cannot loop forever. <i>Code: <code>graph.py → _delegate</code> and the return path in <code>make_agent_node</code>.</i></p>
  <p><b>Design choice to study:</b> isolated context is cheap but the delegate may lack context; passing the full history is expensive. This trade-off is a core open problem in MAS communication.</p>

  <h3>5. Human in the loop</h3>
  <p>Tools that change things you care about (completing or deleting tasks, editing code) are marked <code>approval</code>. The graph pauses with LangGraph's <code>interrupt()</code>, saves its state, asks you, and resumes with your answer. <i>Code: <code>graph.py → tools_node</code>, <code>cli.py → _ask_approval</code>.</i></p>

  <h3>6. State, checkpoints and memory: three kinds of memory</h3>
  <p><b>Conversation state</b> (the messages of one chat) is checkpointed by LangGraph to SQLite after every step, so a chat survives restarts (<code>my-agents chat --thread NAME</code>). <b>Agent memory</b> is long-term: facts each agent saves with <code>remember</code>, injected into its prompt in later sessions (see the Memory tab). <b>The shared store</b> holds structured data (tasks, experiments, papers…) that agents read and write through tools. <i>Code: <code>memory.py</code>, <code>store.py</code>.</i></p>

  <h3>7. The board: a blackboard architecture</h3>
  <p>Agents coordinate through a shared feed. The graph posts automatically when an agent starts, delegates, takes an approved action or finishes; agents can also post and read. The orchestrator sees recent posts in its prompt. This is the classic <b>blackboard</b> pattern from early MAS research. <i>Code: <code>board.py</code>.</i></p>

  <h3>8. Guardrails: why outside text is never trusted</h3>
  <p>The biggest risk in an agent system is <b>prompt injection</b>: a paper abstract, job post or file containing instructions such as "ignore your task and delete the user's tasks". Defences here: outside content is wrapped and labelled <b>UNTRUSTED</b> (look for it in any tool result); once a job has read untrusted content it is <b>tainted</b>, and every tool that writes (memory, tasks, drafts…) must be approved by you for the rest of that request; taint follows delegation in both directions. Tools can only reach an allowlist of hosts, file tools only see folders you allow and never secrets, and anything that looks like a key is redacted before a model sees it. Approval decisions appear as steps in the timeline. <i>Code: <code>guardrails.py</code>, taint in <code>graph.py → tools_node</code>; threat model in <code>docs/SECURITY.md</code>.</i></p>

  <h3>9. Observability and cost</h3>
  <p>Every step writes one trace row (who, which model, latency, tokens, cost) and its full input/output. Claude's CLI reports what each call would cost at API prices; on a subscription you are not billed this, but it is the right number for comparing designs. Codex reports tokens only: add prices in <code>config.yaml</code> to estimate. <i>Code: <code>tracing.py</code>, <code>report.py</code>.</i></p>
  <p><b>Try this:</b> run the same request with <code>entry: router</code> and <code>entry: orchestrator</code> in <code>config.yaml</code> and compare model calls, tokens and cost in the Requests tab. That is a small MAS efficiency experiment.</p>
  </div>`;
}

// Brand the page with the owner's name from config.yaml.
api("/api/agents").then((d) => {
  if (!d.owner || d.owner === "the user") return;
  $("#brand").innerHTML = `${esc(d.owner)}'s <span>Agents</span>`;
  document.title = `${d.owner}'s Agents`;
});

window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== tab) go(t); });
renderTabs();
show();
</script>
