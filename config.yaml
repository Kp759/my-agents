# Which model picks the agent for each message.
# A small local model is enough for routing and costs nothing.
# Switch to `backend: claude-cli` with `model: haiku` if Ollama isn't running.
router:
  backend: ollama
  model: qwen3:8b
  options:
    think: false             # Qwen3 thinks by default: ~11 s per route; off: ~0.4 s
  default_agent: explainer   # used when the router's reply names no agent
