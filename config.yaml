# Whose team this is. Agents address the owner by this name; the dashboard and reports use it too.
owner: Dr.K

# Which accounts the agents use. The CLIs pick an account from these folders;
# pinning them here means the agents always use these accounts, whichever terminal
# starts them. API-key variables are ignored so calls stay on the subscription plans.
accounts:
  claude_config_dir: ~/.claude-njit   # lizzie.lyc@gmail.com, Max plan
  codex_home: ~/.codex-njit

router:
  # entry: router       → a small local model picks an agent for each message (fast, free);
  #                       multi-step requests go to the orchestrator.
  # entry: orchestrator → every message goes to the orchestrator, which delegates.
  entry: router
  orchestrator: orchestrator
  backend: ollama
  model: qwen3:8b
  options:
    think: false             # Qwen3 thinks by default: ~11 s per route; off: ~0.4 s
  default_agent: orchestrator   # used when the router's reply names no agent

# Prepended to every agent's system prompt: the goal the whole team shares.
mission: |
  You are one of {owner}'s agents. {owner} is a PhD student; address them as {owner}.
  Shared mission: help {owner} become a strong candidate for a research role at Anthropic.
  Two things matter equally: deep understanding and research depth.
  - Teach, don't just answer: explain the mechanism (why it works), connect it to fundamentals,
    and say how you got your answer, so the user learns the method and not only the result.
  - Build depth: point to the key papers, open problems and the questions an Anthropic interviewer
    or reviewer would probe; suggest a small hands-on exercise when it helps.
  - Be honest about uncertainty. Never invent facts, numbers or citations.
  - Use your memory: build on what you know about the user and save what you learn about them
    (level, goals, gaps, preferences) with `remember`, so every session builds on the last.

# Added to every agent's prompt right after the mission, with `{today}` filled in on each
# call. A model only knows the world up to its training cutoff; this tells it so, and
# tells it to check with live tools (web_search, web_fetch, tech_news, search_papers…).
freshness: |
  ## Today is {today}
  Your training data ends before today, so your memory of anything that changes is probably
  out of date: model and library releases, APIs, papers, benchmarks, people's roles, companies,
  job openings, prices, deadlines and conference dates.
  - Sources first, then your own knowledge. For any question about the world, start from
    sources: the system often searches for you before you answer; otherwise look it up with
    your tools first. Then check the sources against what you know, say whether they agree,
    and only then answer. Prefer primary sources (official docs, release notes, the paper);
    search snippets are short and can be stale, so open (web_fetch) the best results.
  - After looking something up, state only what the results say. If they don't answer the
    question, say so and don't fill the gap from memory.
  - Cite what you used with its date ("Anthropic docs, accessed {today}"; "arXiv, March 2026").
  - When sources disagree, trust the newest primary source and say there was a disagreement.
  - If you have no tool that can check, say your answer is from training data and may be outdated,
    or delegate to an agent that can check.

# Search first. auto: before an agent that has web_search answers, the router model above
# decides whether the question needs facts about the world and writes a search query; the
# graph runs the search and gives the results to the agent, which answers from the sources
# and checks them against its own knowledge. Works the same on every model, because it
# doesn't rely on the model remembering to search. off: each agent decides for itself.
grounding: auto

# Who writes the prose of the end-of-day report (`my-agents eod`). Local = free.
eod:
  backend: ollama
  model: qwen3:8b
  options:
    think: false

# Optional: $ per 1M tokens, to estimate cost for backends that don't report it.
# Claude's CLI reports cost itself. Keys are a model name or a backend name.
# pricing:
#   codex-cli: {input: 0.0, cached_input: 0.0, output: 0.0}
pricing: {}

# GitHub access through the `gh` CLI (your `gh auth login`). Reading works on any repo
# you can see. Writing (issues, comments, draft PRs) always asks you first and only
# works on repos matching these patterns.
github:
  write_repos:
    - Kp759/*
  clone_dir: ~/Downloads/agent-repos   # must be inside security.allowed_roots

# Telegram (`my-agents telegram setup`, then `my-agents telegram`).
telegram:
  secrets_file: ~/.config/my-agents/telegram.env   # bot token + your user id; outside the repo, chmod 600
  eod_time: "21:00"                                # send the end-of-day report at this local time; blank = off

# The study loop (see src/my_agents/study.py). The Telegram bot runs each job once a day at
# `at` (local time) on `days` (default every day) by sending `prompt` to `agent`, and sends
# you the answer. `sticky: true` keeps your replies going to that agent (send /done to stop),
# so you can answer a quiz in plain text. Run one now: `my-agents study run JOB` or /run JOB.
# `{focus}` and `{owner}` are filled in. Edit freely; this is your study routine.
study:
  focus: "LLM multi-agent systems: coordination, communication, orchestration, evaluation and MAS safety"
  schedule:
    - name: digest
      at: "08:00"
      agent: trend_scout
      prompt: |
        Morning research digest for {owner}. Find the 3 most important papers or posts from the
        last 7 days on {focus}. Use trending_papers, search_papers (sort=recent) and web_search
        (recency=week). For each: title, link, date; problem, method and result in 3 sentences;
        and one sentence on why it would matter in an Anthropic research interview.
        End with one question worth thinking about today. Don't save anything: {owner} will tell
        you what to save. Under 350 words.
    - name: quiz
      at: "20:30"
      agent: examiner
      sticky: true
      prompt: |
        Evening quiz for {owner}. Call due_reviews. Pick the most overdue topic (if nothing is due,
        the weakest topic in list_quiz_results). Say which topic it is, then ask ONE question at the
        depth of an Anthropic research interview, using the topic's objectives, and wait for the
        answer. Ask 3 questions in total, one at a time, grading each answer. Then record the
        score with record_quiz_result, using the topic name exactly as due_reviews shows it.
    - name: career
      at: "18:00"
      days: [sun]
      agent: career_coach
      prompt: |
        Weekly career check for {owner}, aiming for a research role at Anthropic as soon as possible.
        1. Find current Anthropic roles related to {focus} (agents, multi-agent, safety, evaluations,
           research engineering) with job_postings, and list titles and links.
        2. Read the best fit with job_description and compare its requirements with list_skills,
           list_experiments and the GitHub repos. Quote the requirements you rely on.
        3. Give the top 3 gaps with one concrete action each for this week (5 hours in total), and
           the single most valuable portfolio item to finish next.
        4. End with one mock interview question for {owner} to answer.

# Guardrails (see docs/SECURITY.md).
security:
  # File and code tools only work under these folders. Secrets (.ssh, .env, keys,
  # credential stores) are always blocked, even inside them.
  allowed_roots:
    - ~/Downloads
    - ~/Documents
